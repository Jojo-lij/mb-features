<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万豪旅享家 China App — 功能说明</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #F0EFEA;
      --bg-surface: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-content: #FFFFFF;
      --bg-hover: rgba(212,149,106,0.08);
      --accent: #D4956A;
      --accent-light: #E8B896;
      --accent-dark: #B87D52;
      --text-primary: #1A1A1A;
      --text-secondary: #555555;
      --text-muted: #888888;
      --text-inverse: #1A1A1A;
      --text-inverse-muted: #888888;
      --border: #E8E8E0;
      --border-light: #F0F0F0;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-base: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-base);
      color: var(--text-inverse);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ===== Header ===== */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .brand-logo {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-inverse);
      letter-spacing: 0.5px;
    }

    .brand-logo span {
      color: var(--accent);
      position: relative;
    }

    .brand-logo span::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-inverse-muted);
      font-weight: 400;
    }

    .header-stats {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .stat-item {
      text-align: left;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-inverse);
      line-height: 1.1;
      font-family: 'Playfair Display', serif;
    }

    .stat-value.accent {
      color: var(--accent);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-inverse-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* ===== Global Search ===== */
    .global-search {
      position: relative;
      flex: 1;
      max-width: 480px;
      margin: 0 32px;
    }

    .global-search-input {
      width: 100%;
      padding: 10px 36px 10px 40px;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-surface);
      transition: all 0.2s ease;
    }

    .global-search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212,149,106,0.12);
    }

    .global-search-input::placeholder {
      color: var(--text-muted);
    }

    .global-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .global-search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border: none;
      background: var(--border-light);
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s ease;
    }

    .global-search-clear:hover {
      background: var(--border);
      color: var(--text-primary);
    }

    .search-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(212,149,106,0.08);
      border: 1px solid rgba(212,149,106,0.2);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .search-info-bar strong {
      color: var(--accent-dark);
    }

    .search-modules-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .search-empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    /* ===== Global Search Results ===== */
    .search-results-header {
      margin-bottom: 24px;
    }

    .search-results-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .search-results-header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .search-results-header strong {
      color: var(--accent-dark);
    }

    .overview-filter-header {
      margin-bottom: 24px;
    }

    .overview-filter-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .overview-filter-header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .overview-filter-header strong {
      color: var(--accent-dark);
    }

    .overview-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .overview-back-btn:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
      background: var(--bg-hover);
    }

    .overview-back-btn svg {
      color: var(--text-muted);
    }

    .search-results-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .search-results-module {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .search-results-module-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
    }

    .search-results-module-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .search-results-module-title .module-icon {
      color: var(--accent);
    }

    .search-results-count {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .search-results-badges {
      display: flex;
      gap: 6px;
    }

    .search-results-table {
      margin: 0;
      border: none;
    }

    .search-result-row {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .search-result-row:hover {
      background: var(--bg-hover);
    }

    .search-highlight {
      background: rgba(212,149,106,0.3);
      color: var(--text-primary);
      border-radius: 2px;
      padding: 0 1px;
      font-weight: 500;
    }

    .feature-module,
    .feature-section {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .highlight-row {
      animation: highlight-pulse 2s ease;
    }

    @keyframes highlight-pulse {
      0% { background: rgba(212,149,106,0.25); }
      100% { background: transparent; }
    }

    /* ===== Main Layout ===== */
    .main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 100px 40px 48px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 0;
      min-height: 100vh;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      position: sticky;
      top: 88px;
      height: calc(100vh - 120px);
      overflow-y: auto;
      padding-right: 24px;
      border-right: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-inverse-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      padding-left: 12px;
    }

    .nav-list {
      list-style: none;
    }

    .nav-item {
      margin-bottom: 2px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-inverse-muted);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
      border-left: 3px solid transparent;
    }

    .nav-link:hover {
      background: var(--bg-hover);
      color: var(--text-inverse);
    }

    .nav-link.active {
      background: var(--bg-hover);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .nav-count {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #F0F0F0;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .nav-link.active .nav-count {
      background: rgba(212,149,106,0.15);
      color: var(--accent);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }

    .nav-link:hover .nav-icon,
    .nav-link.active .nav-icon {
      opacity: 1;
    }

    /* Status filter */
    .filter-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .filter-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-inverse-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      padding-left: 12px;
    }

    .filter-options {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .filter-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-inverse-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .filter-chip:hover {
      background: var(--bg-hover);
      color: var(--text-inverse);
    }

    .filter-chip.active {
      background: var(--bg-hover);
      color: var(--text-inverse);
      font-weight: 500;
    }

    .filter-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-live { background: #4ADE80; box-shadow: 0 0 6px rgba(74,222,128,0.4); }
    .dot-new { background: #60A5FA; box-shadow: 0 0 6px rgba(96,165,250,0.4); }
    .dot-iterate { background: #FBBF24; box-shadow: 0 0 6px rgba(251,191,36,0.4); }
    .dot-pending { background: #9CA3AF; }

    /* ===== Content Area ===== */
    .content {
      background: var(--bg-content);
      min-height: calc(100vh - 100px);
      padding: 32px 40px;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      margin-left: 24px;
    }

    /* Module Header */
    .module-header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .module-title-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .module-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .module-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      font-family: 'Playfair Display', serif;
    }

    .module-desc {
      font-size: 15px;
      color: var(--text-secondary);
      margin-left: 58px;
      max-width: 600px;
    }

    .module-stats-bar {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      margin-left: 58px;
    }

    .module-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .module-stat strong {
      color: var(--text-primary);
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      font-size: 16px;
    }

    /* Overview Dashboard */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .overview-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .overview-card[data-module],
    .overview-stat-card {
      cursor: pointer;
    }

    .overview-card[data-module]:hover,
    .overview-stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent);
    }

    .overview-number {
      font-size: 36px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
      margin-bottom: 6px;
      font-family: 'Playfair Display', serif;
    }

    .overview-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .overview-card.highlight {
      background: var(--bg-base);
      border-color: var(--accent);
    }

    .overview-card.highlight .overview-number {
      color: var(--accent);
    }

    .overview-card.highlight .overview-label {
      color: var(--text-inverse-muted);
    }

    /* Status legend */
    .status-legend {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      padding: 14px 20px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Section Cards */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    .section-card:hover {
      box-shadow: var(--shadow-md);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .section-header:hover {
      background: var(--bg-content);
    }

    .section-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .section-toggle {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
      color: var(--text-muted);
    }

    .section-toggle.expanded {
      transform: rotate(90deg);
    }

    .section-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .section-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 4px;
    }

    .section-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }

    .badge-live { background: #DCFCE7; color: #166534; }
    .badge-new { background: #DBEAFE; color: #1E40AF; }
    .badge-iterate { background: #FEF3C7; color: #92400E; }
    .badge-pending { background: #F3F4F6; color: #4B5563; }

    /* Feature Table */
    .feature-table {
      width: 100%;
      border-collapse: collapse;
    }

    .feature-table thead {
      background: var(--bg-content);
    }

    .feature-table th {
      padding: 10px 24px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .feature-table td {
      padding: 12px 24px;
      border-top: 1px solid var(--border-light);
      font-size: 14px;
      vertical-align: top;
    }

    .feature-table tbody tr {
      transition: background 0.15s ease;
    }

    .feature-table tbody tr:hover {
      background: var(--bg-content);
    }

    .feature-row {
      cursor: pointer;
    }

    .feature-row.active {
      background: #FEF8F0;
    }

    .feature-row.active .feature-name {
      color: var(--accent-dark);
    }

    .feature-id {
      font-family: 'SF Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .feature-name {
      font-weight: 500;
      color: var(--text-primary);
    }

    .feature-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status-live { background: #DCFCE7; color: #166534; }
    .status-new { background: #DBEAFE; color: #1E40AF; }
    .status-iterate { background: #FEF3C7; color: #92400E; }
    .status-pending { background: #F3F4F6; color: #4B5563; }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .feature-note {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 300px;
    }

    .feature-screenshot-cell {
      width: 90px;
      padding: 8px 24px !important;
      text-align: center;
    }

    .screenshot-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      background: var(--bg-content);
      color: var(--text-muted);
    }

    .screenshot-count-badge:hover {
      background: var(--bg-base);
      color: var(--text-inverse);
    }

    .screenshot-count-badge.has-screenshot {
      background: #E8F5E9;
      color: #2E7D32;
    }

    .screenshot-count-badge.has-screenshot:hover {
      background: #2E7D32;
      color: var(--bg-card);
    }

    .screenshot-placeholder-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Collapsible content */
    .section-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .section-content.expanded {
      max-height: 5000px;
    }

    /* Search Bar */
    .search-bar {
      position: relative;
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px 12px 44px;
      border: 1px solid var(--border-light);
      border-radius: 999px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-card);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212,149,106,0.1);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: var(--radius-md);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .lightbox.active .lightbox-img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.2);
    }

    .lightbox-caption {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Feature Detail Panel */
    .feature-detail-panel {
      background: var(--bg-content);
      border-top: 1px solid var(--border-light);
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .feature-detail-panel.expanded {
      max-height: 900px;
    }

    .detail-panel-inner {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      padding: 24px;
    }

    .detail-left {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-right {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 800px;
      overflow-y: auto;
    }

    .detail-right-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .detail-right-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .detail-version {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .detail-screenshot-main {
      width: 280px;
      height: 500px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      overflow: hidden;
      background: var(--bg-content);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-screenshot-main img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .detail-screenshot-main img:hover {
      transform: scale(1.02);
    }

    .detail-thumbs {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .detail-thumb {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-sm);
      border: 2px solid transparent;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-thumb:hover {
      border-color: var(--accent-light);
    }

    .detail-thumb.active {
      border-color: var(--accent);
    }

    .detail-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-table-wrapper {
      flex: 1;
      overflow-y: auto;
    }

    .detail-note-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
      border: 1px solid var(--border-light);
    }
    .detail-note-table th {
      background: #f5f5f0;
      color: var(--text-primary);
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid var(--border-light);
    }
    .detail-note-table td {
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      vertical-align: top;
      line-height: 1.6;
      color: var(--text-secondary);
    }
    .detail-note-table tr:nth-child(even) {
      background: #fafafa;
    }
    .detail-note-table tr:hover {
      background: #f0f0f0;
    }
    .detail-note-table td ul {
      margin: 0;
      padding-left: 16px;
    }
    .detail-note-table td ul li {
      margin-bottom: 4px;
    }
    .detail-note-table td ul li:last-child {
      margin-bottom: 0;
    }

    .detail-update-log {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
    }

    .detail-update-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .detail-update-content {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .feature-detail-row {
      display: none;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .main {
        grid-template-columns: 1fr;
        padding: 90px 20px 40px;
      }
      .sidebar {
        display: none;
      }
      .content {
        margin-left: 0;
        border-radius: var(--radius-lg);
        padding: 24px;
      }
      .overview-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .header-inner {
        padding: 16px 20px;
      }
      .header-stats {
        gap: 20px;
      }
      .global-search {
        max-width: 320px;
        margin: 0 16px;
      }
    }

    @media (max-width: 768px) {
      .global-search {
        max-width: 200px;
      }
      .global-search-input {
        font-size: 12px;
        padding: 8px 32px 8px 36px;
      }
    }

    @media (max-width: 640px) {
      .header-stats {
        display: none;
      }
      .global-search {
        max-width: none;
        margin: 0 0 0 12px;
        flex: 1;
      }
      .overview-grid {
        grid-template-columns: 1fr;
      }
      .module-title {
        font-size: 22px;
      }
      .feature-table {
        font-size: 12px;
      }
      .feature-table th,
      .feature-table td {
        padding: 8px 16px;
      }
      .feature-note,
      .feature-evidence {
        display: none;
      }
      .detail-panel-inner {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .detail-meta-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-card {
      animation: fadeInUp 0.5s ease forwards;
    }

    .section-card:nth-child(1) { animation-delay: 0.05s; }
    .section-card:nth-child(2) { animation-delay: 0.1s; }
    .section-card:nth-child(3) { animation-delay: 0.15s; }
    .section-card:nth-child(4) { animation-delay: 0.2s; }
    .section-card:nth-child(5) { animation-delay: 0.25s; }
    .section-card:nth-child(6) { animation-delay: 0.3s; }
    .section-card:nth-child(7) { animation-delay: 0.35s; }
    .section-card:nth-child(8) { animation-delay: 0.4s; }
  </style>
</head>

    function highlightText(text, query) {
      if (!text || !query) return text || '';
      const lowerText = String(text).toLowerCase();
      const lowerQuery = query.toLowerCase();
      if (!lowerText.includes(lowerQuery)) return text;

      const result = [];
      let lastIndex = 0;
      let index = lowerText.indexOf(lowerQuery);
      while (index !== -1) {
        result.push(String(text).slice(lastIndex, index));
        result.push(`<span class="search-highlight">${String(text).slice(index, index + query.length)}</span>`);
        lastIndex = index + query.length;
        index = lowerText.indexOf(lowerQuery, lastIndex);
      }
      result.push(String(text).slice(lastIndex));
      return result.join('');
    }

              const field = m[2].trim();
              let desc = m[3].trim();
              // 检查是否有备注
              const noteMatch = desc.match(/(.+?)(?:\s*备注[：:](.+))?$/);
              const mainDesc = noteMatch ? noteMatch[1] : desc;
              const note = noteMatch && noteMatch[2] ? noteMatch[2].trim() : '';
              parsed.push({ num, field, desc: mainDesc, note });
            }
          }
          if (parsed.length > 0) {
            tableHtml = `
              <table class="detail-note-table">
                <thead><tr><th style="width:50px;">序号</th><th style="width:120px;">字段</th><th>说明</th><th style="width:150px;">备注</th></tr></thead>
                <tbody>
                  ${parsed.map(p => `<tr>
                    <td>${highlightText(p.num, query)}</td>
                    <td>${highlightText(p.field, query)}</td>
                    <td>${highlightText(p.desc, query)}</td>
                    <td>${p.note ? highlightText(p.note, query) : '—'}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            `;
          }
        }
        if (!tableHtml) {
          tableHtml = `<div class="detail-description">${highlightText(detail, query)}</div>`;
        }
      } else {
        tableHtml = `<div class="detail-description">暂无详细说明</div>`;
      }

      // 更新记录（从数据中提取或默认）
      const updateLog = f.updateLog || '2026-06-12: 新增';

      return `
        <tr class="feature-detail-row" id="${detailId}" style="display:none;">
          <td colspan="6" style="padding:0;border:none;">
            <div class="feature-detail-panel" id="${detailId}-panel">
              <div class="detail-panel-inner">
                <div class="detail-left">
                  ${screenshotHtml}
                </div>
                <div class="detail-right">
                  <div class="detail-right-header">
                    <div class="detail-right-title">
                      <span class="detail-id">${highlightText(f.id, query)}</span>
                      <span class="detail-name">${highlightText(f.name, query)}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;">
                      <span class="feature-status ${s.class}"><span class="status-dot" style="background:currentColor;"></span>${s.label}</span>
                      <span class="detail-version">当前版本：V1</span>
                    </div>
                  </div>
                  <div class="detail-table-wrapper">
                    <div class="detail-section-title">功能详情</div>
                    ${tableHtml}
                  </div>
                  <div class="detail-update-log">
                    <div class="detail-update-title">更新记录</div>
                    <div class="detail-update-content">${updateLog}</div>
                  </div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    function renderModule(module) {
      const allFeatures = getAllFeatures(module);
      const filteredFeatures = filterFeatures(allFeatures, currentFilter).filter(f => featureMatchesSearch(f));
      const counts = countByStatus(filteredFeatures);

      let sectionsHtml = '';
      module.sections.forEach((section, idx) => {
        const sectionFeatures = filterFeatures(section.features, currentFilter).filter(f => featureMatchesSearch(f));
        if (sectionFeatures.length === 0 && (currentFilter !== 'all' || globalSearchQuery)) return;

        const sectionId = `${module.id}-section-${idx}`;
        const isExpanded = expandedSections.has(sectionId);
        const sectionCounts = countByStatus(section.features);

        const badgesHtml = Object.entries(sectionCounts)
          .filter(([_, count]) => count > 0)
          .map(([status, count]) => `<span class="badge ${statusMap[status].badge}">${count}</span>`)
          .join('');

        const featuresHtml = sectionFeatures.map(f => {
          const s = statusMap[f.status];
          const detailId = `${sectionId}-detail-${f.id}`;
          const screenshotCount = (() => {
            let count = 0;
            if (f.screenshot) count++;
            if (f.screenshot2) count++;
            if (f.screenshots && Array.isArray(f.screenshots)) count += f.screenshots.length;
            return count;
          })();
          const hasScreenshot = screenshotCount > 0;
          const screenshotCell = hasScreenshot
            ? `<button class="screenshot-count-badge has-screenshot" onclick="event.stopPropagation(); toggleFeatureDetail('${detailId}', this.closest('tr'))">${screenshotCount} 张</button>`
            : `<span class="screenshot-placeholder-text">—</span>`;

          const detailPanel = renderFeatureDetail(f, detailId);

          return `
            <tr class="feature-row" data-detail="${detailId}" onclick="toggleFeatureDetail('${detailId}', this)">
              <td><span class="feature-id">${f.id}</span></td>
              <td><span class="feature-name">${f.name}</span></td>
              <td><span class="feature-status ${s.class}"><span class="status-dot" style="background:currentColor;"></span>${s.label}</span></td>
              <td class="feature-note">${f.desc || f.note || ''}</td>
              <td class="feature-screenshot-cell" onclick="event.stopPropagation();">${screenshotCell}</td>
            </tr>
            ${detailPanel}
          `;
        }).join('');

        const allExpanded = sectionFeatures.every(f => {
          const did = `${sectionId}-detail-${f.id}`;
          const dp = document.getElementById(did + '-panel');
          return dp && dp.classList.contains('expanded');
        });

        sectionsHtml += `
          <div class="section-card">
            <div class="section-header" data-section="${sectionId}">
              <div class="section-header-left">
                <span class="section-toggle ${isExpanded ? 'expanded' : ''}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                </span>
                <span class="section-name">${section.name}</span>
                <span class="section-count">(${sectionFeatures.length}${currentFilter !== 'all' ? '' : '/' + section.features.length})</span>
              </div>
              <div class="section-badges">${badgesHtml}</div>
            </div>
            <div class="section-content ${isExpanded ? 'expanded' : ''}">
              <table class="feature-table">
                <thead>
                  <tr>
                    <th style="width:80px;">编号</th>
                    <th>功能名称</th>
                    <th style="width:100px;">状态</th>
                    <th>说明</th>
                    <th style="width:100px;">截图</th>
                  </tr>
                </thead>
                <tbody>${featuresHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      });

      const searchInfoHtml = globalSearchQuery ? `
        <div class="search-info-bar">
          <span>"${globalSearchQuery}" 的搜索结果：找到 <strong>${filteredFeatures.length}</strong> 项功能</span>
          ${searchMatches.size > 1 ? `<span class="search-modules-hint">共 ${searchMatches.size} 个模块匹配</span>` : ''}
        </div>
      ` : '';

      return `
        <div class="module-header">
          <div class="module-title-row">
            <div class="module-icon">${iconMap[module.id]}</div>
            <h1 class="module-title">${module.name}</h1>
          </div>
          <p class="module-desc">${module.desc}</p>
          <div class="module-stats-bar">
            <div class="module-stat"><strong>${filteredFeatures.length}</strong> 项功能</div>
            ${counts.live > 0 ? `<div class="module-stat"><strong>${counts.live}</strong> 已上线</div>` : ''}
            ${counts.new > 0 ? `<div class="module-stat"><strong>${counts.new}</strong> 新增</div>` : ''}
            ${counts.iterate > 0 ? `<div class="module-stat"><strong>${counts.iterate}</strong> 计划更新</div>` : ''}
            ${counts.pending > 0 ? `<div class="module-stat"><strong>${counts.pending}</strong> 待确认</div>` : ''}
          </div>
        </div>

        ${searchInfoHtml}

        <div class="search-bar">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索功能名称、编号或说明...">
        </div>

        ${sectionsHtml || (globalSearchQuery ? '<div class="search-empty-state">当前模块中没有匹配 "' + globalSearchQuery + '" 的功能</div>' : '')}
      `;
    }

    function renderContent() {
      const content = document.getElementById('content');
      const module = modules.find(m => m.id === currentModule);

      if (globalSearchQuery && module.isOverview) {
        content.innerHTML = renderSearchResults();
      } else if (module.isOverview) {
        content.innerHTML = renderOverview();

        // Module cards click -> navigate to module
        content.querySelectorAll('.overview-card[data-module]').forEach(card => {
          card.addEventListener('click', () => {
            currentModule = card.dataset.module;
            renderNav();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });

        // Stat cards click -> show filtered feature list
        content.querySelectorAll('.overview-stat-card[data-filter]').forEach(card => {
          card.addEventListener('click', () => {
            overviewFilter = card.dataset.filter;
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });

        // Scroll to module distribution
        content.querySelectorAll('.overview-stat-card[data-scroll="modules"]').forEach(card => {
          card.addEventListener('click', () => {
            const target = document.getElementById('overviewModuleDistribution');
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });

        // Back button -> return to overview
        const backBtn = document.getElementById('overviewBackBtn');
        if (backBtn) {
          backBtn.addEventListener('click', () => {
            overviewFilter = null;
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }
      } else {
        content.innerHTML = renderModule(module);
        bindModuleHandlers(content);
      }
    }

    function bindModuleHandlers(content) {
      // Section toggle handlers
      content.querySelectorAll('.section-header').forEach(header => {
        header.addEventListener('click', () => {
          const sectionId = header.dataset.section;
          const sectionContent = header.nextElementSibling;
          const toggle = header.querySelector('.section-toggle');

          if (expandedSections.has(sectionId)) {
            expandedSections.delete(sectionId);
            sectionContent.classList.remove('expanded');
            toggle.classList.remove('expanded');
          } else {
            expandedSections.add(sectionId);
            sectionContent.classList.add('expanded');
            toggle.classList.add('expanded');
          }
        });
      });

      // Search handler
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          content.querySelectorAll('.feature-table tbody tr').forEach(row => {
            // 跳过详情面板行
            if (row.classList.contains('feature-detail-row')) return;
            const text = row.textContent.toLowerCase();
            const shouldShow = text.includes(query);
            row.style.display = shouldShow ? '' : 'none';
            // 同时隐藏对应的详情面板
            const detailId = row.dataset.detail;
            if (detailId) {
              const detailRow = document.getElementById(detailId);
              if (detailRow) detailRow.style.display = 'none';
            }
          });
          // 搜索时重置展开状态
          if (activeDetailId) {
            const prevDetailPanel = document.getElementById(activeDetailId + '-panel');
            const prevRow = document.querySelector(`[data-detail="${activeDetailId}"]`);
            if (prevDetailPanel) prevDetailPanel.classList.remove('expanded');
            if (prevRow) prevRow.classList.remove('active');
            activeDetailId = null;
          }
        });
      }
    }

    function renderFilters() {
      document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentFilter = chip.dataset.filter;
          if (!modules.find(m => m.id === currentModule).isOverview) {
            renderContent();
          }
        });
      });
    }

    // ===== Lightbox =====
    function openLightbox(src, caption) {
      let lightbox = document.getElementById('lightbox');
      if (!lightbox) {
        lightbox = document.createElement('div');
        lightbox.id = 'lightbox';
        lightbox.className = 'lightbox';
        lightbox.innerHTML = `
          <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
          <img class="lightbox-img" id="lightboxImg" src="" alt="">
          <div class="lightbox-caption" id="lightboxCaption"></div>
        `;
        lightbox.addEventListener('click', (e) => {
          if (e.target === lightbox) closeLightbox();
        });
        document.body.appendChild(lightbox);
      }
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxCaption').textContent = caption;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      if (lightbox) {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    function switchScreenshot(galleryId, index, src) {
      const main = document.getElementById(galleryId + '-main');
      if (!main) return;
      const mainImg = main.querySelector('img');
      const thumbs = document.querySelectorAll('#' + galleryId + '-main').length > 0
        ? main.parentElement.querySelectorAll('.detail-thumb')
        : [];
      if (mainImg) {
        mainImg.src = src;
        mainImg.onclick = () => openLightbox(src, mainImg.alt);
      }
      thumbs.forEach((t, i) => {
        t.classList.toggle('active', i === index);
      });
    }

    // ===== Feature Detail Toggle =====
    let activeDetailId = null;

    function toggleFeatureDetail(detailId, rowEl) {
      const detailRow = document.getElementById(detailId);
      const detailPanel = document.getElementById(detailId + '-panel');
      // 如果点击的是当前已展开的功能，则收起
      if (activeDetailId === detailId) {
        detailPanel.classList.remove('expanded');
        setTimeout(() => {
          detailRow.style.display = 'none';
        }, 400);
        rowEl.classList.remove('active');
        activeDetailId = null;
        return;
      }

      // 收起之前展开的面板
      if (activeDetailId) {
        const prevDetailRow = document.getElementById(activeDetailId);
        const prevDetailPanel = document.getElementById(activeDetailId + '-panel');
        const prevRow = document.querySelector(`[data-detail="${activeDetailId}"]`);
        if (prevDetailPanel) prevDetailPanel.classList.remove('expanded');
        if (prevDetailRow) {
          setTimeout(() => { prevDetailRow.style.display = 'none'; }, 400);
        }
        if (prevRow) prevRow.classList.remove('active');
      }

      // 展开新面板
      detailRow.style.display = 'table-row';
      // 强制重排以确保 transition 生效
      detailRow.offsetHeight;
      requestAnimationFrame(() => {
        detailPanel.classList.add('expanded');
      });
      rowEl.classList.add('active');
      activeDetailId = detailId;

      // 滚动到视图
      setTimeout(() => {
        detailPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    // ===== INIT =====

  </script>
</body>
</html>
