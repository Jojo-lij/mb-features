<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万豪旅享家 China App — 功能说明</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">Marriott B<span>o</span>nvoy</div>
        <div class="brand-subtitle">China App 功能说明</div>
      </div>
      <div class="global-search">
        <svg class="global-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="global-search-input" id="globalSearchInput" placeholder="搜索功能名称 / 说明 / 字段 / 功能说明...">
        <button class="global-search-clear" id="globalSearchClear" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="header-stats">
        <div class="stat-item">
          <div class="stat-value" id="statTotal">—</div>
          <div class="stat-label">功能总数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statModules">—</div>
          <div class="stat-label">功能模块</div>
        </div>
        <div class="stat-item">
          <div class="stat-value accent" id="statLive">—</div>
          <div class="stat-label">已上线</div>
        </div>
        <div class="stat-item">
          <div class="stat-value accent" id="statNew">—</div>
          <div class="stat-label">新增/迭代</div>
        </div>
        <div class="data-source-status" id="dataSourceStatus" title="当前页面使用的数据来源">本地数据</div>
      </div>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-title">功能模块</div>
      <ul class="nav-list" id="navList"></ul>
      <div class="filter-section">
        <div class="filter-title">状态筛选</div>
        <div class="filter-options" id="statusFilterContainer">
          <button class="filter-chip active" data-filter="all">
            <span class="filter-dot" style="background: var(--text-inverse);"></span>全部状态
          </button>
        </div>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>

  <div id="bmDrawerRoot"></div>

  <script src="js/data.js"></script>
  <script src="js/modules/benchmark.js"></script>
  <script src="js/modules/overview.js"></script>
  <script src="js/modules/launch.js"></script>
  <script src="js/modules/homepage.js"></script>
  <script src="js/modules/discover.js"></script>
  <script src="js/modules/shop.js"></script>
  <script src="js/modules/trips.js"></script>
  <script src="js/modules/account.js"></script>
  <script src="js/modules/wallet.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/mbop.js"></script>
  <script src="js/modules/group.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
